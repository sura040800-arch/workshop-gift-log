<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20364a"><title>いただき物管理</title><style>
:root{--ink:#20364a;--accent:#426b86;--bg:#f3f5f6;--line:#e2e7eb;--muted:#687783}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202b33;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{background:var(--ink);color:white;padding:22px 18px}header small{letter-spacing:.16em;color:#c5d1da}h1{font-size:23px;margin:7px 0 4px}header p{font-size:12px;color:#d3dce3;margin:0}nav{position:sticky;top:0;display:flex;background:white;padding:9px 12px;gap:8px;border-bottom:1px solid var(--line)}nav button{flex:1;border:0;border-radius:9px;padding:12px 6px;background:#eef2f4;color:#344653;font-weight:700}nav button.active{background:var(--ink);color:white}main{max-width:760px;margin:auto;padding:14px}.view{display:none}.view.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}h2{font-size:17px;margin:0 0 13px}.hint{font-size:11px;color:var(--muted);line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #cbd5dc;border-radius:9px;padding:12px;font:inherit;font-size:16px;background:white;color:#24313a}textarea{min-height:75px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.primary,.secondary{border-radius:10px;padding:13px;font-weight:700}.primary{width:100%;border:0;background:var(--accent);color:white;margin-top:16px}.secondary{border:1px solid #cbd5dc;background:#f8fafb;color:#263b49}.badge{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#fff1dc;color:#895014}.done{background:#e3f3e9;color:#24623b}.item{display:flex;gap:12px;align-items:center}.thumb{width:70px;height:70px;object-fit:cover;border-radius:9px;background:#edf1f3;display:grid;place-items:center}.item h3{font-size:15px;margin:0 0 5px}.item p{font-size:12px;color:var(--muted);margin:3px 0}.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1;font-size:11px;padding:10px 4px}.stats{display:flex;gap:10px}.stat{flex:1;background:#f5f7f8;padding:10px;border-radius:9px}.stat strong{display:block;font-size:22px;color:var(--ink)}.stat span{font-size:11px;color:var(--muted)}.photo{border:1px dashed #b6c2cb;padding:12px;border-radius:10px}.photo img{max-width:100%;max-height:200px;display:block;margin:10px auto}.empty{text-align:center;color:var(--muted);padding:24px}.detail{display:grid;grid-template-columns:95px 1fr;gap:10px;font-size:13px}.key{color:var(--muted)}.notice{background:#fff6e8;color:#795326;padding:10px;border-radius:9px;font-size:11px;line-height:1.6;margin-bottom:12px}@media(min-width:600px){.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:span 2}}
</style><body><header><small>WORKSHOP · GIFT RECORD</small><h1>いただき物管理</h1><p>お客様からいただいた品物と、お礼状の記録</p></header><nav><button class="active" data-v="list">一覧・検索</button><button data-v="form">＋ 新規登録</button></nav><main>
<section id="list" class="view active"><div class="card"><h2>記録の一覧</h2><div class="stats"><div class="stat"><strong id="total">0</strong><span>登録件数</span></div><div class="stat"><strong id="pending">0</strong><span>お礼状 未送付</span></div></div><label>キーワード検索</label><input id="search" placeholder="品物・お客様・受取担当者"><div class="row" style="margin-top:9px"><select id="filter"><option value="all">すべて表示</option><option value="pending">お礼状 未送付</option><option value="done">お礼状 送付済み</option></select><span id="count" class="hint grow" style="text-align:right"></span></div></div><div id="records"></div><div class="card"><p class="hint">確認用試作です。記録はこの端末のブラウザ内だけに保存され、他の端末とは共有されません。実際のお客様情報は入力しないでください。</p><div class="row"><button class="secondary grow" id="backup">バックアップ出力</button><button class="secondary grow" id="restoreBtn">バックアップ読込</button><input id="restoreFile" type="file" accept="application/json" hidden></div></div></section>
<section id="form" class="view"><div class="card"><h2 id="formTitle">いただき物を登録</h2><p class="hint">必須：品物・お客様・いただいた日</p><form id="giftForm"><div class="formgrid">
<div><label>品物 *</label><input id="item" required placeholder="例：焼き菓子"></div><div><label>お客様 *</label><input id="customer" required placeholder="お客様のお名前"></div><div><label>いただいた日 *</label><input id="date" type="date" required></div><div><label>数量</label><input id="quantity" placeholder="例：2箱"></div>
<div class="span2"><label>お客様の郵便番号</label><div class="row"><input class="grow" id="postal" inputmode="numeric" placeholder="6170002"><button class="secondary" type="button" id="lookup">住所検索</button></div><div id="zipmsg" class="hint">郵便番号7桁で検索できます。</div></div>
<div class="span2"><label>お客様の住所</label><textarea id="address" placeholder="番地・建物名を追記"></textarea></div><div><label>お客様の電話番号</label><input id="phone" type="tel" placeholder="075-000-0000"></div><div><label>受け取った人</label><input id="receiver" placeholder="スタッフ名"></div>
<div class="span2"><label>実物の写真</label><div class="photo"><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden></div></div><div class="span2"><label>お礼状</label><select id="thanks"><option value="pending">未送付</option><option value="done">送付済み</option></select></div></div><button class="primary">保存する</button><button class="secondary" type="button" id="clear" style="width:100%;margin-top:8px">入力をクリア</button></form></div></section>
<section id="detail" class="view"><div class="card" id="detailBody"></div><button class="secondary" id="back" style="width:100%">一覧に戻る</button></section></main>
<script>
const $=id=>document.getElementById(id),KEY="workshop-gift-records-v1";let data=[],editId=null,pic="";const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{data=[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert("保存できません。写真の容量が大きすぎる可能性があります。");return false}}function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));scrollTo(0,0)}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="form")reset();show(b.dataset.v)});$("date").value=today();
$("lookup").onclick=async()=>{let z=$("postal").value.replace(/\D/g,"");$("zipmsg").textContent="検索中…";if(!/^\d{7}$/.test(z)){$("zipmsg").textContent="郵便番号は7桁で入力してください。";return}try{let j=await(await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+z)).json();if(!j.results)throw 0;let a=j.results[0];$("address").value=a.address1+a.address2+a.address3;$("zipmsg").textContent="住所を入力しました。番地などを追記してください。"}catch{$("zipmsg").textContent="住所が見つからないか、通信に失敗しました。"}};
$("photo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pic=c.toDataURL("image/jpeg",.72);$("preview").src=pic;$("preview").hidden=false};im.src=r.result};r.readAsDataURL(f)};
function reset(){editId=null;pic="";$("giftForm").reset();$("preview").hidden=true;$("preview").removeAttribute("src");$("date").value=today();$("formTitle").textContent="いただき物を登録"}$("clear").onclick=reset;
$("giftForm").onsubmit=e=>{e.preventDefault();let old=data.find(x=>x.id===editId),x={id:editId||crypto.randomUUID(),item:$("item").value.trim(),customer:$("customer").value.trim(),date:$("date").value,quantity:$("quantity").value,postal:$("postal").value,address:$("address").value,phone:$("phone").value,receiver:$("receiver").value,photo:pic,thanks:$("thanks").value};let prev=data;data=editId?data.map(y=>y.id===editId?x:y):[x,...data];if(!save()){data=prev;return}reset();render();show("list")};
function render(){let q=$("search").value.toLowerCase(),f=$("filter").value,a=data.filter(x=>(f==="all"||x.thanks===f)&&[x.item,x.customer,x.receiver].join(" ").toLowerCase().includes(q));$("total").textContent=data.length;$("pending").textContent=data.filter(x=>x.thanks==="pending").length;$("count").textContent=a.length+"件";$("records").innerHTML="";if(!a.length){$("records").innerHTML='<div class="card empty">記録はありません。「新規登録」から追加できます。</div>';return}a.forEach(x=>{let d=document.createElement("div");d.className="card";d.innerHTML='<div class="item">'+(x.photo?'<img class="thumb" src="'+x.photo+'">':'<div class="thumb">写真なし</div>')+'<div class="grow"><h3>'+esc(x.item)+'</h3><p>'+esc(x.customer)+' 様 · '+esc(x.date)+'</p><p>数量：'+esc(x.quantity||"未入力")+'　受取：'+esc(x.receiver||"未入力")+'</p><span class="badge '+(x.thanks==="done"?"done":"")+'">'+(x.thanks==="done"?"お礼状 送付済み":"お礼状 未送付")+'</span></div></div><div class="actions"><button class="secondary" data-d="'+x.id+'">詳細</button><button class="secondary" data-e="'+x.id+'">編集</button><button class="secondary" data-t="'+x.id+'">'+(x.thanks==="done"?"未送付に戻す":"送付済みにする")+'</button></div>';$("records").append(d)});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>detail(b.dataset.d));document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{let x=data.find(y=>y.id===b.dataset.t);x.thanks=x.thanks==="done"?"pending":"done";save();render()})}
function detail(id){let x=data.find(y=>y.id===id),fs=[["品物",x.item],["お客様",x.customer],["日付",x.date],["数量",x.quantity],["郵便番号",x.postal],["住所",x.address],["電話番号",x.phone],["受取担当",x.receiver],["お礼状",x.thanks==="done"?"送付済み":"未送付"]];$("detailBody").innerHTML='<h2>記録の詳細</h2><div class="detail">'+fs.map(([k,v])=>'<div class="key">'+k+'</div><div>'+esc(v||"未入力")+'</div>').join("")+'</div>'+(x.photo?'<img src="'+x.photo+'" style="width:100%;max-height:260px;object-fit:contain;margin-top:12px">':"")+'<div class="actions"><button class="secondary" id="de">編集</button><button class="secondary" id="dd">削除</button></div>';$("de").onclick=()=>edit(id);$("dd").onclick=()=>{if(confirm("削除しますか？")){data=data.filter(y=>y.id!==id);save();render();show("list")}};show("detail")}
function edit(id){let x=data.find(y=>y.id===id);editId=id;["item","customer","date","quantity","postal","address","phone","receiver","thanks"].forEach(k=>$(k).value=x[k]||"");pic=x.photo||"";$("preview").src=pic;$("preview").hidden=!pic;$("formTitle").textContent="記録を編集";show("form")}
$("search").oninput=render;$("filter").onchange=render;$("backup").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.href=u;a.download="gift-records-backup.json";a.click();URL.revokeObjectURL(u)};$("restoreBtn").onclick=()=>$("restoreFile").click();$("restoreFile").onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a))throw 0;if(confirm(a.length+"件を追加しますか？")){let ids=new Set(data.map(x=>x.id));data.push(...a.filter(x=>!ids.has(x.id)));save();render()}}catch{alert("読み込めませんでした")}e.target.value=""};load();render();
</script></body></html>
